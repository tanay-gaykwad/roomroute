name: Bug report
description: Report a reproducible problem in RoomRoute.
title: "bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: >-
        Do not include passwords, private user information, exact home addresses,
        or security vulnerabilities. Use the private process in SECURITY.md for
        security concerns.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: List the steps, using fictional or sample data.
      placeholder: "1. Open… 2. Choose… 3. Submit…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, and whether you used Docker or the Python preview.
      placeholder: "Windows 11, Chrome, Docker Compose"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant error output
      description: Remove email addresses, tokens, and other private information first.
    validations:
      required: false
