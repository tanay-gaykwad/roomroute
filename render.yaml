services:
  - type: web
    name: roomroute
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: roomroute-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: roomroute-limits
          property: connectionString
      - key: ROOMROUTE_DB_POOL_SIZE
        value: "10"
      - key: ROOMROUTE_PUBLIC_URL
        sync: false
      - key: ROOMROUTE_ALLOWED_HOSTS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_STARTTLS
        value: "1"
      - key: SMTP_FROM
        sync: false

  - type: keyvalue
    name: roomroute-limits
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: roomroute-db
    databaseName: roomroute
    user: roomroute
    plan: free
    region: singapore
    postgresMajorVersion: "16"
